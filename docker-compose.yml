services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["lifeos-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=lifeos;Username=lifeos;Password=${POSTGRES_PASSWORD}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__JwtIssuer: ${SUPABASE_URL}/auth/v1
      Supabase__JwtAudience: authenticated
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports: ["5080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5080
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  lifeos-postgres:
